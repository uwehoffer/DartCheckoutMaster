
name: Android APK erstellen

on:
  workflow_dispatch:
  push:
    branches:
      - hauptsaechlich

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android-Projekt entpacken
        run: |
          unzip DartCheckoutMaster_Android_Projekt_korrigiert.zip -d android-src

      - name: APK bauen
        run: |
          cd android-src/DartCheckoutMaster_Android
          gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: DartCheckoutMaster-APK
          path: android-src/DartCheckoutMaster_Android/app/build/outputs/apk/debug/app-debug.apk
